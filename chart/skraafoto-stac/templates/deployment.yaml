apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skraafoto-stac.fullname" . }}
  labels:
    {{- include "skraafoto-stac.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "skraafoto-stac.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skraafoto-stac.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: stac-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8081"
            - name: WEB_CONCURRENCY
              value: {{ .Values.webConcurrency | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: DEBUG
              value: {{ .Values.debug | quote }}
            - name: POSTGRES_HOST
              value: {{ required "postgres.host is required" .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DBNAME
              value: {{ required "postgres.dbname is required" .Values.postgres.dbname | quote }}
            - name: POSTGRES_APPLICATION_NAME
              value: {{ .Values.postgres.applicationName | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.existingSecret is required" .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_PASS
            - name: COGTILER_BASEPATH
              value: {{ .Values.cogtilerBasepath | quote }}
            - name: TRUSTED_HOSTS
              value: {{ required "trustedHosts is required" .Values.trustedHosts | quote }}
          readinessProbe:
            httpGet:
              path: /_mgmt/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_mgmt/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
